name: Check

# The gate `pnpm check` runs locally, run again where it cannot be skipped:
# oxfmt, oxlint, typecheck across every package, knip, dependency-cruiser and the
# Intent skill validator. Until this existed the only enforcement was the
# simple-git-hooks pre-commit hook — which a `--no-verify`, or a clone whose
# `pnpm install` never ran `prepare`, opts out of silently.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run when the branch is pushed again. The release and Pages
# flows deliberately let theirs finish; a half-finished check is worth nothing.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from the root packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No build step: inside the workspace every package's exports point at src/
      # (dist/ is swapped in by publishConfig at pack time), so typecheck, knip and
      # depcruise all read the sources directly.
      - name: Check
        run: pnpm check
